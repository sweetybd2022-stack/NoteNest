name: Build NoteNest APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android folder
        run: flutter create --org com.notenest --project-name notenest --platforms android .
      - name: Remove default test
        run: rm -rf test
      - name: Patch Android settings
        run: bash tools/patch_android.sh
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: NoteNest-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
